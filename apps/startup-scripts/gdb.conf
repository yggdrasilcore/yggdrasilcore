# Performance: skip loading shared library symbols on startup
set auto-solib-add off

# Disable remote debuginfod lookups to prevent network stalls
set debuginfod enabled off

# Non-interactive batch settings
set pagination off
set confirm off

# Logging configuration
set logging file /yggdrasilcore/monitor/crashlogs.txt
set logging enabled on
set logging overwrite off

# Formatted backtrace output
set print pretty on
set print frame-arguments all

# Execute target binary
run

# -------------------------------------------------------------
# On crash: load shared library symbols on demand and backtrace
# -------------------------------------------------------------
sharedlibrary
info threads
thread apply all backtrace full
quit

