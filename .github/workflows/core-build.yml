name: docker-build

on:
  push:
    branches: [ "*master*" ]
    paths:
      - "**.c"
      - "**.cc"
      - "**.cpp"
      - "**.cxx"
      - "**.h"
      - "**.hh"
      - "**.hpp"
      - "**.sh"
      - "**/CMakeLists.txt"
      - "**/cmakelists.txt"
      - "**.cmake"
      - "**/Dockerfile"
      - "**/dockerfile"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - ".github/**"
  pull_request:
    branches: [ "*master*" ]
    paths:
      - "**.c"
      - "**.cc"
      - "**.cpp"
      - "**.cxx"
      - "**.h"
      - "**.hh"
      - "**.hpp"
      - "**.sh"
      - "**/CMakeLists.txt"
      - "**/cmakelists.txt"
      - "**.cmake"
      - "**/Dockerfile"
      - "**/dockerfile"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - ".github/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: "docker-build-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_FILE: "docker-compose.yml:.github/ci/docker-compose.ci.yml"
  # Project client data (dbc, maps, vmaps, mmaps, Cameras).
  CLIENT_DATA_URL: "https://github.com/yggdrasilcore/client-data/releases/download/v1/Data.zip"
  WORLD_STARTUP_TIMEOUT: 900
  WORLD_UPTIME_SECONDS: 60

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    name: ubuntu-24.04-docker
    timeout-minutes: 240

    steps:
    - name: Detect source changes
      id: changes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        files=""
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate --jq '.[].filename')
        elif [ "${{ github.event_name }}" = "push" ]; then
          files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' || true)
        fi
        code=false
        if [ -z "$files" ]; then
          code=true
        else
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            lower="${file,,}"
            # Chore files and SQL-only changes do not require a compile.
            if [[ "$lower" =~ (^|/)\.git ]] ||
               [[ "$lower" =~ \.(md|markdown|txt|rst|png|jpe?g|gif|svg|ico)$ ]] ||
               [[ "$lower" =~ (^|/)(license|authors)(\.|$) ]] ||
               [[ "$lower" =~ (^|/)\.editorconfig$ ]]; then
              continue
            fi
            if [[ "$lower" =~ \.(c|cc|cpp|cxx|h|hh|hpp|sh)$ ]] ||
               [[ "$lower" =~ (^|/)cmakelists\.txt$ ]] ||
               [[ "$lower" =~ \.cmake$ ]] ||
               [[ "$lower" =~ (^|/)dockerfile$ ]] ||
               [[ "$lower" =~ (^|/)docker-compose[^/]*\.ya?ml$ ]] ||
               [[ "$lower" =~ ^\.github/ ]]; then
              code=true
              break
            fi
          done <<< "$files"
        fi
        if [ "$code" = "true" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "No source changes; skipping build."
        fi

    - name: Free disk space
      if: steps.changes.outputs.code == 'true'
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
        sudo apt-get clean
        docker system prune -af || true
        df -h

    - name: Checkout YggdrasilCore
      if: steps.changes.outputs.code == 'true'
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1
        persist-credentials: false

    - name: Download client data
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -fL "$CLIENT_DATA_URL" -o client-data.zip
        mkdir -p client-data
        unzip -q client-data.zip -d client-data
        rm client-data.zip
        ls -1 client-data

    - name: Prepare runtime directories
      if: steps.changes.outputs.code == 'true'
      run: |
        mkdir -p env/dist/etc env/dist/logs
        # The images run as uid/gid 1000 (see docker-compose build args).
        sudo chown -R 1000:1000 env/dist

    - name: Set up Docker Buildx
      if: steps.changes.outputs.code == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Expose GitHub Actions cache runtime
      if: steps.changes.outputs.code == 'true'
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Restore compiler cache
      if: steps.changes.outputs.code == 'true'
      uses: actions/cache/restore@v4
      with:
        path: var/docker/ccache
        key: ccache-docker-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-docker-${{ github.ref }}-
          ccache-docker-

    - name: Build Docker images
      if: steps.changes.outputs.code == 'true'
      run: |
        docker buildx bake --load \
          -f docker-compose.yml \
          -f .github/ci/docker-compose.ci.yml \
          yggdrasilcore-db-import \
          yggdrasilcore-authserver \
          yggdrasilcore-worldserver

    - name: Export compiler cache
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/ccache-export"
        rm -rf "$dest"
        docker buildx build \
          --file apps/docker/Dockerfile \
          --target ccache-export \
          --build-arg "CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}" \
          --output "type=local,dest=$dest" \
          .
        rm -rf var/docker/ccache
        mkdir -p var/docker/ccache
        cp -a "$dest/out/." var/docker/ccache/
        du -sh var/docker/ccache

    - name: Start database
      if: steps.changes.outputs.code == 'true'
      run: docker compose up -d yggdrasilcore-database

    - name: Wait for database
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        timeout 180 bash -c '
          until [ "$(docker inspect -f "{{.State.Health.Status}}" yggdrasilcore-database 2>/dev/null)" = "healthy" ]; do
            sleep 2
          done
        '
        docker inspect -f 'database health: {{.State.Health.Status}}' yggdrasilcore-database

    - name: Import SQL
      if: steps.changes.outputs.code == 'true'
      run: |
        docker compose run --rm --no-deps yggdrasilcore-db-import

    - name: Start auth and world servers
      if: steps.changes.outputs.code == 'true'
      env:
        DOCKER_VOL_DATA: ${{ runner.temp }}/client-data
      run: |
        docker compose up -d --no-deps yggdrasilcore-authserver yggdrasilcore-worldserver

    - name: Wait for world startup
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        deadline=$((SECONDS + WORLD_STARTUP_TIMEOUT))
        while (( SECONDS < deadline )); do
          if docker compose logs --no-color yggdrasilcore-worldserver 2>/dev/null | grep -q "World Initialized"; then
            echo "World initialization complete."
            exit 0
          fi
          running=$(docker inspect -f '{{.State.Running}}' yggdrasilcore-worldserver 2>/dev/null || echo false)
          if [ "$running" != "true" ]; then
            echo "::error::worldserver stopped before completing startup"
            exit 1
          fi
          sleep 5
        done
        echo "::error::worldserver did not complete startup within ${WORLD_STARTUP_TIMEOUT}s"
        exit 1

    - name: Create test account
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail

        # The worldserver console is the container's stdin. `script` gives
        # `docker attach` a TTY while we feed it the commands, then we detach
        # with Ctrl-P Ctrl-Q. Verification is done against the DB.
        attach_log="$RUNNER_TEMP/attach.log"
        {
          sleep 5
          printf '.account create docker docker\n'
          sleep 5
          printf '.account set gmlevel docker 3 -1\n'
          sleep 5
          printf '\020\021'
        } | timeout 45 script -qec "docker attach yggdrasilcore-worldserver" /dev/null >"$attach_log" 2>&1 || true

        for _ in $(seq 1 12); do
          if docker compose exec -T yggdrasilcore-database sh -c \
            'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT 1 FROM ycore_auth.account WHERE username = \"DOCKER\""' \
            | grep -q 1; then
            echo "test account ready"
            exit 0
          fi
          sleep 5
        done
        echo "=== worldserver attach log ==="
        tail -80 "$attach_log" || true
        echo "::error::test account was not created"
        exit 1

    - name: Create test character
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        docker compose exec -T yggdrasilcore-database sh -c \
          'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" ycore_characters' <<'SQL'
        INSERT INTO characters
          (guid, account, name, race, class, gender, level, xp, money,
           position_x, position_y, position_z, map, zone, orientation,
           taximask, exploredZones, equipmentCache, knownTitles,
           health, power1, power2, power3, power4, power5, power6, power7,
           innTriggerId)
        SELECT 1, a.id, 'Docker', 1, 1, 0, 1, 0, 0,
               -8949.95, -132.493, 83.5312, 0, 12, 0,
               '', '', '', '',
               100, 0, 0, 0, 0, 0, 0, 0,
               0
        FROM ycore_auth.account AS a
        WHERE a.username = 'DOCKER';
        SQL
        docker compose exec -T yggdrasilcore-database sh -c \
          'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT name FROM ycore_characters.characters WHERE name = \"Docker\""' \
          | grep -qx Docker

    - name: Headless character login
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/mostlynick3/WoW-Chat-Client.git "$RUNNER_TEMP/wow-chat-client"
        cd "$RUNNER_TEMP/wow-chat-client"
        python3 - <<'PY'
        import sys
        import time

        sys.path.insert(0, ".")
        from app.wow_client import WoWChatManager

        client = WoWChatManager()
        try:
            result = client.fetch_realms("127.0.0.1", 3724, "docker", "docker")
            assert result["ok"], result

            result = client.fetch_characters(client.realms[0]["id"])
            assert result["ok"], result

            result = client.enter_world("Docker")
            assert result["ok"], result
            assert client.state == "online", client.state

            for command in (
                ".tele dalaran",
                ".tele stormwind",
                "I am chatting",
                ".npc add temp 36853",
            ):
                result = client.send("say", command)
                assert result["ok"], (command, result)
                time.sleep(5)
        finally:
            client.disconnect()

        print("headless login and GM commands OK")
        PY

    - name: Verify servers stay up
      if: steps.changes.outputs.code == 'true'
      run: |
        set -euo pipefail
        sleep "$WORLD_UPTIME_SECONDS"
        for container in yggdrasilcore-authserver yggdrasilcore-worldserver; do
          running=$(docker inspect -f '{{.State.Running}}' "$container")
          restarts=$(docker inspect -f '{{.RestartCount}}' "$container")
          echo "$container: running=$running restarts=$restarts"
          [ "$running" = "true" ]
          [ "$restarts" = "0" ]
        done

    - name: Dump logs
      if: failure() && steps.changes.outputs.code == 'true'
      run: docker compose logs --no-color

    - name: Tear down
      if: always() && steps.changes.outputs.code == 'true'
      run: docker compose down -v --remove-orphans

    - name: Save compiler cache
      if: always() && steps.changes.outputs.code == 'true'
      uses: actions/cache/save@v4
      with:
        path: var/docker/ccache
        key: ccache-docker-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
