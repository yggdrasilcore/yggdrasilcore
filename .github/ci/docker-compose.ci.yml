# CI-only overlay: keep the build lean enough for a GitHub-hosted runner.
# The default Dockerfile builds every image in RelWithDebInfo with warnings on;
# the smoke test only needs the servers and dbimport.
#
# The scope of each build is fixed per image (see the build variants in the
# Dockerfile), so there is no scope argument to pass here anymore. Only the
# warning level is still tunable.
services:
  yggdrasilcore-db-import:
    build:
      args:
        CWITH_WARNINGS: "OFF"
      cache_from:
        - type=gha,scope=yggdrasilcore-build

  yggdrasilcore-authserver:
    build:
      args:
        CWITH_WARNINGS: "OFF"
      cache_from:
        - type=gha,scope=yggdrasilcore-build

  yggdrasilcore-worldserver:
    build:
      args:
        CWITH_WARNINGS: "OFF"
      cache_from:
        - type=gha,scope=yggdrasilcore-build
      cache_to:
        - type=gha,mode=max,scope=yggdrasilcore-build
